name: godash
description: "Cross-platform Flutter + Go/TinyGo bridge: protobuf FFI transport, code generation, and native build tooling."
version: 2.2.9

repository: https://github.com/nosuta/godash
issue_tracker: https://github.com/nosuta/godash/issues

environment:
  sdk: ^3.12.0
  flutter: ">=3.41.0"

dependencies:
  ffi: ^2.2.0
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  logging: ^1.3.0
  path_provider: ^2.1.5
  protobuf: ^6.0.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
