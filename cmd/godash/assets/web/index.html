<!DOCTYPE html>
<html oncontextmenu="event.preventDefault();">

<head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="{{APP_TITLE}}">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="{{APP_TITLE}}">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />

    <title>{{APP_TITLE}}</title>
    <link rel="manifest" href="manifest.json">
    <style>
        html {
            color: #828282;
            background-color: rgb(0, 0, 0);
        }

        /* The Flutter engine takes over <body> and forces it to the full
           viewport. Constraining its height (e.g. 95vh) makes the app shorter
           than the visual viewport, which feeds a stale physicalSize into the
           engine's keyboard-inset math. Keep <body> unconstrained and center
           the loading spinner with fixed positioning instead. */
        body {
            margin: 0;
        }

        #loading,
        #loading div,
        #loading div:after,
        #loading div:before {
            box-sizing: border-box;
        }

        #loading {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            margin: auto;
            width: 80px;
            height: 80px;
            transform: rotate(45deg);
            transform-origin: 40px 40px;
        }

        #loading div {
            top: 28px;
            left: 28px;
            position: absolute;
            width: 32px;
            height: 32px;
            background: currentColor;
            animation: lds-heart 1.2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        #loading div:after,
        #loading div:before {
            content: " ";
            position: absolute;
            display: block;
            width: 32px;
            height: 32px;
            background: currentColor;
        }

        #loading div:before {
            left: -24px;
            border-radius: 50% 0 0 50%;
        }

        #loading div:after {
            top: -24px;
            border-radius: 50% 50% 0 0;
        }

        @keyframes lds-heart {
            0% {
                transform: scale(0.95);
            }

            5% {
                transform: scale(1.1);
            }

            39% {
                transform: scale(0.85);
            }

            45% {
                transform: scale(1);
            }

            60% {
                transform: scale(0.95);
            }

            100% {
                transform: scale(0.9);
            }
        }



        @media (prefers-color-scheme: light) {
            html {
                color: #000;
                background-color: rgb(255, 255, 255);
            }


        }
    </style>
</head>

<body>
    <div id="loading">
        <div></div>
    </div>
    <script>
        // Workaround for an upstream Flutter web engine assertion. On mobile
        // browsers, dismissing the on-screen keyboard can make the engine
        // compute a stale physicalSize and fail an internal debug assert
        // ("ViewInsets cannot be negative" in lib/web_ui .../window.dart
        // _computeOnScreenKeyboardInsets), which surfaces as an uncaught
        // promise rejection. It does not affect the app; drop just that error
        // so it does not spam the console. Remove once the engine is fixed.
        (function () {
            function isKeyboardInsetAssertion(reason) {
                if (!reason) return false;
                var text = reason.message || (reason.toString ? String(reason) : '');
                return text.indexOf('ViewInsets cannot be negative') !== -1;
            }
            window.addEventListener('unhandledrejection', function (event) {
                if (isKeyboardInsetAssertion(event.reason)) event.preventDefault();
            });
            window.addEventListener('error', function (event) {
                var message = event.message || '';
                if (isKeyboardInsetAssertion(event.error) ||
                    message.indexOf('ViewInsets cannot be negative') !== -1) {
                    event.preventDefault();
                }
            });
        })();
    </script>
    <script src="flutter_bootstrap.js" async></script>
</body>

</html>
