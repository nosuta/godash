name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race ./...

  web:
    name: Web worker (wasm + Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: Prepare wasm test assets
        run: |
          # The wasmbrowsertest harness embeds the sqlite3 wasm assets and
          # scroll_worker.js, which are gitignored and normally copied by
          # `godash prepare_go_wasm_test`.
          curl -fsSL -o /tmp/sqlite-wasm.zip https://sqlite.org/2026/sqlite-wasm-3530300.zip
          unzip -q -o /tmp/sqlite-wasm.zip -d /tmp/sqlite-wasm
          jswasm=/tmp/sqlite-wasm/sqlite-wasm-3530300/jswasm
          cp "$jswasm/sqlite3.js" "$jswasm/sqlite3.wasm" "$jswasm/sqlite3-opfs-async-proxy.js" cmd/go_js_wasm_exec/
          cp cmd/godash/assets/scroll_worker.js cmd/go_js_wasm_exec/
          # Keep this patch in sync with sqliteOpfsDeletePatchScript() in
          # cmd/godash/build_scripts.go. Chromium 401692415: sync-handle
          # writes do not update the persisted .usage file, but
          # removeEntry() subtracts the file size anyway. Truncate to zero
          # before deleting so the saved usage cannot underflow to ~2^32.
          if ! grep -q 'opfs-truncate-before-removeEntry' cmd/go_js_wasm_exec/sqlite3-opfs-async-proxy.js; then
            perl -0pi -e '
              s/await fh\.dirHandle\.removeEntry\(fh\.filenamePart\)/await deleteEntry(fh.dirHandle, fh.filenamePart)/s;
              s/await hDir\.removeEntry\(filenamePart, \{recursive\}\)/await deleteEntry(hDir, filenamePart, recursive)/s;
              s/await hDir\.removeEntry\(filenamePart\);/await deleteEntry(hDir, filenamePart);/s;
              my $helper = q~
            // opfs-truncate-before-removeEntry
            // Chromium 401692415: writes through a FileSystemSyncAccessHandle do not
            // update the persisted File System/.usage file, but removeEntry() subtracts
            // the deleted file size anyway. Truncate the file to zero first so the
            // deletion subtracts nothing and the saved usage cannot underflow.
            const deleteEntry = async (hDir, filenamePart, recursive = false) => {
              let sah;
              try {
                const hFile = await hDir.getFileHandle(filenamePart);
                sah = await hFile.createSyncAccessHandle();
                sah.truncate(0);
                await sah.flush();
              } catch (e) {
                // Directories and locked files cannot be truncated; removeEntry() below
                // remains the delete operation and will report any real failure.
              } finally {
                try { sah?.close(); } catch (e) {}
              }
              return hDir.removeEntry(filenamePart, {recursive});
            };
          ~;
              my $anchor = "  const closeSyncHandleNoThrow = async (fh)=>{\n    try{await closeSyncHandle(fh)}\n    catch(e){\n      warn(\"closeSyncHandleNoThrow() ignoring:\",e,fh);\n    }\n  };";
              my $pos = index($_, $anchor);
              die "sqlite OPFS proxy patch anchor not found\n" if $pos < 0;
              substr($_, $pos + length($anchor), 0) = $helper;
            ' cmd/go_js_wasm_exec/sqlite3-opfs-async-proxy.js
          fi
      - name: Install wasmbrowsertest harness
        run: |
          cd cmd/go_js_wasm_exec
          go build -o /tmp/go_js_wasm_exec .
      - name: Web worker protocol tests
        # Ubuntu CI images disable unprivileged user namespaces, so Chrome's
        # sandbox cannot initialize; the harness opts into --no-sandbox.
        # ./sqlite exercises the OPFS driver's error contract in the browser.
        # It is a separate test binary (worker) because sqlite3InitModule may
        # only run once per worker.
        run: GOOS=js GOARCH=wasm go test -exec /tmp/go_js_wasm_exec ./web ./sqlite ./sqlite/webtest
        env:
          WASM_NO_SANDBOX: "on"

  tinygo:
    name: TinyGo web worker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: "0.42.0"
      - name: Download modules
        run: go mod download
      - name: Build web worker (TinyGo)
        run: GOOS=js GOARCH=wasm tinygo build -no-debug -panic=trap -opt=2 -o /tmp/worker_tinygo.wasm ./benchmark/web/worker

  dart:
    name: Dart (flutter analyze + test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze lib test benchmark
      - name: Test
        run: flutter test
      - name: Shared-memory web interop smoke (Node)
        run: |
          dart compile js -o /tmp/shared_ring_web_smoke.js test/web/shared_ring_web_smoke.dart
          node /tmp/shared_ring_web_smoke.js
