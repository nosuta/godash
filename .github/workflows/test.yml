name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race ./...

  web:
    name: Web worker (wasm + Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: Prepare wasm test assets
        run: |
          # The wasmbrowsertest harness embeds the sqlite3 wasm assets and
          # scroll_worker.js, which are gitignored and normally copied by
          # `godash prepare_go_wasm_test`.
          curl -fsSL -o /tmp/sqlite-wasm.zip https://sqlite.org/2026/sqlite-wasm-3530300.zip
          unzip -q -o /tmp/sqlite-wasm.zip -d /tmp/sqlite-wasm
          jswasm=/tmp/sqlite-wasm/sqlite-wasm-3530300/jswasm
          cp "$jswasm/sqlite3.js" "$jswasm/sqlite3.wasm" "$jswasm/sqlite3-opfs-async-proxy.js" cmd/go_js_wasm_exec/
          cp cmd/godash/assets/scroll_worker.js cmd/go_js_wasm_exec/
      - name: Install wasmbrowsertest harness
        run: |
          cd cmd/go_js_wasm_exec
          go build -o /tmp/go_js_wasm_exec .
      - name: Web worker protocol tests
        run: GOOS=js GOARCH=wasm go test -exec /tmp/go_js_wasm_exec ./web

  tinygo:
    name: TinyGo web worker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: "0.42.0"
      - name: Download modules
        run: go mod download
      - name: Build web worker (TinyGo)
        run: GOOS=js GOARCH=wasm tinygo build -no-debug -panic=trap -opt=2 -o /tmp/worker_tinygo.wasm ./benchmark/web/worker

  dart:
    name: Dart (flutter analyze + test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze lib test benchmark
      - name: Test
        run: flutter test
      - name: Shared-memory web interop smoke (Node)
        run: |
          dart compile js -o /tmp/shared_ring_web_smoke.js test/web/shared_ring_web_smoke.dart
          node /tmp/shared_ring_web_smoke.js
