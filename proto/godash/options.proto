// on a unary method whose request/response messages contain only fixed-layout
// scalar fields to opt the method into the packed-struct hot path.
package godash;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/nosuta/godash/pb";

extend google.protobuf.MethodOptions {
